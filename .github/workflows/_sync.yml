name: _sync

on:
  workflow_call:
    inputs:
      confirm:
        type: boolean
        required: false
        default: false
      dump:
        type: string
        required: false
        default: ''
      maximum-removal-delta:
        type: string
        default: "0.25"
        required: false

env:
  ADMIN_LIST: "cisco-service,natalisucks,openclarity-service,tiswanso"
  ADMIN_COUNT: 4

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🔒 harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: 🔑 set token
        run: echo "${{ secrets.SERVICE_ACCOUNT_TOKEN }}" > token
      - name: 🚮 dump config
        if: inputs.confirm != true && inputs.dump != ''
        uses: docker://ghcr.io/uwu-tools/peribolos:v0.1.0
        with:
          github-token-path: ./token
          dump: ${{ inputs.dump }}
      - name: 🔄 run peribolos
        if: (inputs.confirm == true || inputs.confirm == false) && inputs.dump == ''
        uses: docker://ghcr.io/uwu-tools/peribolos:v0.1.0
        with:
          github-token-path: ./token
          config-path: org
          required-admins: ${{ env.ADMIN_LIST }}
          min-admins: ${{ env.ADMIN_COUNT }}
          maximum-removal-delta: ${{ inputs.maximum-removal-delta }}
          require-self: true
          fix-org: true
          fix-org-members: true
          fix-teams: true
          fix-team-members: true
          fix-team-repos: true
          confirm: ${{ inputs.confirm }}
