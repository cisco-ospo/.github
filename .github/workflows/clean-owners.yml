name: clean-owners

on:
  # Scheduled trigger
  schedule:
    # Run weekly on Saturdays
    - cron: "30 1 * * 6"
  # Manual trigger
  workflow_dispatch:

permissions:
  issues: none

jobs:
  clean-owners:
    runs-on: ubuntu-latest
    permissions:
        issues: write
    steps:
      - name: 🧼 clean codeowners
        uses: github/cleanowners@88591b92581d8222cb57873719f5d11890ae5cdd # no semver release yet
        env:
          GH_TOKEN: ${{ secrets.CISCO_SERVICE_TOKEN }}
          ORGANIZATION: cisco-ospo
          EXEMPT_REPOS: "cisco-ospo/.github, cisco-ospo/.allstar"
          DRY_RUN: true
